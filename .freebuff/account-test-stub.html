<!-- TEST HARNESS ONLY (not shipped). Injected immediately before the inline
     app.js block so the SIGNED-IN Account Settings path can be exercised
     without a real login. It seeds a syntactically valid session and answers
     the auth endpoints supabase-js calls, so verifySession() keeps the session
     instead of clearing it. Everything else falls through to the real fetch. -->
<script>
(function () {
  var KEY = 'sb-oknfjbwfvhctpohusnfk-auth-token';
  var NOW = Math.floor(Date.now() / 1000);
  var USER = {
    id: '00000000-0000-4000-8000-000000000001',
    aud: 'authenticated', role: 'authenticated',
    email: 'alex.perera@example.lk',
    created_at: '2026-02-14T09:24:11.000Z',
    user_metadata: { full_name: 'Alex Perera', email_verified: true },
    app_metadata: { provider: 'email', providers: ['email'] },
    identities: []
  };
  window.__testUser = USER;
  window.__fetchLog = [];
  // Set __skipSeed before signing out: after the post-logout reload the app
  // must boot as a real guest, so the harness stops re-seeding the session.
  if (window.localStorage.getItem('__skipSeed') === '1') {
    window.localStorage.removeItem(KEY);
    window.__seeded = false;
  } else {
    window.__seeded = true;
  }
  if (window.__seeded) window.localStorage.setItem(KEY, JSON.stringify({
    access_token: 'test.header.payload',
    refresh_token: 'test-refresh',
    token_type: 'bearer',
    expires_in: 3600,
    expires_at: NOW + 3600,
    user: USER
  }));

  var realFetch = window.fetch.bind(window);
  function json(obj, status) {
    return Promise.resolve(new Response(JSON.stringify(obj), {
      status: status || 200,
      headers: { 'Content-Type': 'application/json' }
    }));
  }
  window.fetch = function (url, init) {
    var u = String(url);
    var method = (init && init.method) || 'GET';
    window.__fetchLog.push(method + ' ' + u);
    // updateProfile → PUT /auth/v1/user { data: { full_name } }
    if (u.indexOf('/auth/v1/user') !== -1 && method === 'PUT') {
      var body = {};
      try { body = JSON.parse(init.body); } catch (e) { /* ignore */ }
      window.__lastProfilePut = body;
      window.__testUser = Object.assign({}, window.__testUser, {
        user_metadata: Object.assign({}, window.__testUser.user_metadata, {
          full_name: (body.data && body.data.full_name) || ''
        })
      });
      return json(window.__testUser);
    }
    if (u.indexOf('/auth/v1/user') !== -1) return json(window.__testUser);
    if (u.indexOf('/auth/v1/token') !== -1) {
      return json({
        access_token: 'test.header.payload',
        refresh_token: 'test-refresh',
        token_type: 'bearer',
        expires_in: 3600,
        expires_at: Math.floor(Date.now() / 1000) + 3600,
        user: window.__testUser
      });
    }
    if (u.indexOf('/rest/v1/') !== -1) return json([]);
    return realFetch(url, init);
  };
})();
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Desktop layout probe</title>
<style>
  html, body { margin: 0; padding: 0; background: #222; }
  #wrap { width: 1440px; height: 900px; overflow: hidden; }
  iframe { width: 1440px; height: 900px; border: 0; display: block; }
  #narrow { width: 800px; height: 700px; overflow: hidden; margin-top: 10px; }
  #narrow iframe { width: 800px; height: 700px; }
</style>
</head>
<body>
  <div id="wrap"><iframe id="wide" src="/index.html"></iframe></div>
  <div id="narrow"><iframe id="small" src="/index.html"></iframe></div>
</body>
</html>
